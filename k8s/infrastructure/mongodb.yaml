# Auth DB
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb-auth
spec:
  serviceName: "mongodb-auth"
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-auth
  template:
    metadata:
      labels:
        app: mongodb-auth
    spec:
      containers:
      - name: mongodb
        image: mongo:7.0
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_DATABASE
          value: auth_db
        volumeMounts:
        - name: mongodb-auth-data
          mountPath: /data/db
  volumeClaimTemplates:
  - metadata:
      name: mongodb-auth-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-auth
spec:
  clusterIP: None
  selector:
    app: mongodb-auth
  ports:
  - port: 27017
    targetPort: 27017
---
