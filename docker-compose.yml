services:
  # MongoDB Databases - Separate for each service
  mongodb-auth:
    image: mongo:7.0
    container_name: mongodb-auth
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: auth_db
    volumes:
      - mongodb_auth_data:/data/db
    networks:
      - auction-network

  mongodb-auction:
    image: mongo:7.0
    container_name: mongodb-auction
    restart: always
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: auction_db
    volumes:
      - mongodb_auction_data:/data/db
    networks:
      - auction-network

  mongodb-bidding:
    image: mongo:7.0
    container_name: mongodb-bidding
    restart: always
    ports:
      - "27019:27017"
    environment:
      MONGO_INITDB_DATABASE: bidding_db
    volumes:
      - mongodb_bidding_data:/data/db
    networks:
      - auction-network

  mongodb-payment:
    image: mongo:7.0
    container_name: mongodb-payment
    restart: always
    ports:
      - "27020:27017"
    environment:
      MONGO_INITDB_DATABASE: payment_db
    volumes:
      - mongodb_payment_data:/data/db
    networks:
      - auction-network

  mongodb-notification:
    image: mongo:7.0
    container_name: mongodb-notification
    restart: always
    ports:
      - "27021:27017"
    environment:
      MONGO_INITDB_DATABASE: notification_db
    volumes:
      - mongodb_notification_data:/data/db
    networks:
      - auction-network

  mongodb-community:
    image: mongo:7.0
    container_name: mongodb-community
    restart: always
    ports:
      - "27022:27017"
    environment:
      MONGO_INITDB_DATABASE: community_db
    volumes:
      - mongodb_community_data:/data/db
    networks:
      - auction-network

  mongodb-order:
    image: mongo:7.0
    container_name: mongodb-order
    restart: always
    ports:
      - "27023:27017"
    environment:
      MONGO_INITDB_DATABASE: order_db
    volumes:
      - mongodb_order_data:/data/db
    networks:
      - auction-network

  # Redis Cache & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: auction-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redis123
    volumes:
      - redis_data:/data
    networks:
      - auction-network

  # Auth Service - Xác thực người dùng
  auth-service:
    build:
      context: .
      dockerfile: ./services/auth-service/Dockerfile
    container_name: auth-service
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - ./services/auth-service/src:/app/src
      - ./services/auth-service/package.json:/app/package.json
      - ./shared:/app/shared
    command: node src/index.js
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb-auth:27017/auth_db
      - REDIS_URL=redis://:redis123@redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - JWT_EXPIRE=7d
    depends_on:
      - mongodb-auth
      - redis
    networks:
      - auction-network

  # Auction Service - Quản lý đấu giá
  auction-service:
    build:
      context: .
      dockerfile: ./services/auction-service/Dockerfile
    container_name: auction-service
    restart: always
    ports:
      - "3002:3002"
    volumes:
      - ./services/auction-service/src:/app/src
      - ./services/auction-service/package.json:/app/package.json
      - ./shared:/app/shared
    command: node src/index.js
    environment:
      - NODE_ENV=production
      - PORT=3002
      - MONGODB_URI=mongodb://mongodb-auction:27017/auction_db
      - REDIS_URL=redis://:redis123@redis:6379
      - AUTH_SERVICE_URL=http://auth-service:3001
      - PAYMENT_SERVICE_URL=http://payment-service:3006
    depends_on:
      - mongodb-auction
      - redis
      - auth-service
    networks:
      - auction-network

  # Bidding Service - Xử lý đấu giá realtime
  bidding-service:
    build:
      context: .
      dockerfile: ./services/bidding-service/Dockerfile
    container_name: bidding-service
    restart: always
    ports:
      - "3003:3003"
    volumes:
      - ./services/bidding-service/src:/app/src
      - ./services/bidding-service/package.json:/app/package.json
      - ./shared:/app/shared
    environment:
      - NODE_ENV=production
      - PORT=3003
      - MONGODB_URI=mongodb://mongodb-bidding:27017/bidding_db
      - REDIS_URL=redis://:redis123@redis:6379
      - AUTH_SERVICE_URL=http://auth-service:3001
      - AUCTION_SERVICE_URL=http://auction-service:3002
    depends_on:
      - mongodb-bidding
      - redis
      - auth-service
      - auction-service
    networks:
      - auction-network

  # Notification Service - Thông báo realtime
  notification-service:
    build:
      context: .
      dockerfile: ./services/notification-service/Dockerfile
    container_name: notification-service
    restart: always
    ports:
      - "3014:3004"
    volumes:
      - ./services/notification-service/src:/app/src
      - ./services/notification-service/package.json:/app/package.json
      - ./shared:/app/shared
    command: node src/index.js
    environment:
      - NODE_ENV=production
      - PORT=3004
      - MONGODB_URI=mongodb://mongodb-notification:27017/notification_db
      - REDIS_URL=redis://:redis123@redis:6379
      - AUTH_SERVICE_URL=http://auth-service:3001
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
    depends_on:
      - mongodb-notification
      - redis
      - auth-service
    networks:
      - auction-network

  # Community Service - Posts and Comments
  community-service:
    build:
      context: .
      dockerfile: ./services/community-service/Dockerfile
    container_name: community-service
    restart: always
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
      - MONGODB_URI=mongodb://mongodb-community:27017/community_db
      - REDIS_URL=redis://:redis123@redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      - mongodb-community
      - redis
      - auth-service
    networks:
      - auction-network

  # Payment Service - Wallet & MoMo Integration
  payment-service:
    build:
      context: .
      dockerfile: ./services/payment-service/Dockerfile
    container_name: payment-service
    restart: always
    ports:
      - "3006:3006"
    volumes:
      - ./services/payment-service/src:/app/src
      - ./services/payment-service/package.json:/app/package.json
      - ./shared:/app/shared
    command: node src/index.js
    environment:
      - NODE_ENV=production
      - PORT=3006
      - MONGODB_URI=mongodb://mongodb-payment:27017/payment_db
      - REDIS_URL=redis://:redis123@redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - CORS_ORIGIN=http://localhost:3000
      - MOMO_PARTNER_CODE=MOMO_TEST_PARTNER
      - MOMO_ACCESS_KEY=test_access_key
      - MOMO_SECRET_KEY=test_secret_key
      - MOMO_ENDPOINT=https://test-payment.momo.vn/v2/gateway/api/create
      - MOMO_RETURN_URL=http://localhost:3000/payment/result
      - MOMO_NOTIFY_URL=http://localhost:3006/api/payment/momo/callback
      - AUTH_SERVICE_URL=http://auth-service:3001
    depends_on:
      - mongodb-payment
      - redis
      - auth-service
    networks:
      - auction-network

  # Order Service - Quản lý đơn hàng
  order-service:
    build:
      context: .
      dockerfile: ./services/order-service/Dockerfile
    container_name: order-service
    restart: always
    ports:
      - "3007:3007"
    volumes:
      - ./services/order-service/src:/app/src
      - ./shared:/app/shared
    environment:
      - NODE_ENV=production
      - PORT=3007
      - MONGODB_URI=mongodb://mongodb-order:27017/order_db
      - REDIS_URL=redis://:redis123@redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - AUTH_SERVICE_URL=http://auth-service:3001
    depends_on:
      - mongodb-order
      - redis
      - auth-service
    networks:
      - auction-network

  # Nginx API Gateway
  nginx:
    image: nginx:alpine
    container_name: nginx-gateway
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - auction-service
      - bidding-service
      - payment-service
      - notification-service
      - community-service
      - order-service
    networks:
      - auction-network

networks:
  auction-network:
    driver: bridge

volumes:
  mongodb_auth_data:
  mongodb_auction_data:
  mongodb_bidding_data:
  mongodb_notification_data:
  mongodb_community_data:
  mongodb_payment_data:
  mongodb_order_data:
  redis_data:
